<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>教练登录 · Ice Skating Coach Booking</title>
    <link rel="stylesheet" href="../../css/base.css?v=warm-ui-1" />
    <link rel="stylesheet" href="../../css/coach-profile.css?v=warm-ui-1" />
    <link rel="stylesheet" href="../../css/responsive.css?v=warm-ui-1" />
    <link rel="stylesheet" href="../../css/design-system.css?v=warm-ui-11" />
  </head>
  <body class="landing-body">
    <main class="student-auth-shell coach-auth-shell" aria-labelledby="authHeading">
      <header class="student-auth-header">
        <div class="student-auth-brand">
          <div class="student-auth-logo" aria-hidden="true">
          </div>
          <div>
            <strong>冰场预约</strong>
            <span>专业滑冰教学预约平台</span>
          </div>
        </div>
        <a class="auth-back-link student-page-back" href="../../index.html">⌂ 返回首页</a>
      </header>

      <section class="student-auth-hero">
        <div class="student-auth-copy">
          <h1 id="authHeading">管理<span>教练</span>后台</h1>
          <p>设置每周开放时间，维护资料和价格，并查看实际预约课表。</p>
        </div>

        <a class="primary-button public-preview-button" href="../index.html">先进入 demo 后台</a>

        <div class="access-summary-list">
          <div class="access-summary-item">
            <span class="access-icon public-access-icon" aria-hidden="true">□</span>
            <div>
              <strong>未审核</strong>
              <p>可以提交教练资料，等待冰场或管理员确认。</p>
            </div>
          </div>
          <div class="access-summary-item">
            <span class="access-icon full-access-icon" aria-hidden="true">✓</span>
            <div>
              <strong>已登录</strong>
              <p>管理开放时间、学生预约、课程价格和授课场馆。</p>
            </div>
          </div>
        </div>

        <div class="student-auth-benefits">
          <div>
            <span>◇</span>
            <strong>资料管理</strong>
            <small>头像、价格、场馆</small>
          </div>
          <div>
            <span>○</span>
            <strong>开放时间</strong>
            <small>每周重复设置</small>
          </div>
          <div>
            <span>☆</span>
            <strong>预约课表</strong>
            <small>查看学生安排</small>
          </div>
        </div>
      </section>

      <section class="auth-panel student-login-panel">
        <div class="auth-copy">
          <div class="student-login-mark" aria-hidden="true">
          </div>
          <h2>教练登录</h2>
          <p>登录后管理资料、开放时间和预约课表。</p>
        </div>

        <form id="coachLoginForm" class="auth-form" action="../index.html" method="get">
          <label>
            邮箱
            <span class="auth-input-wrap auth-input-email">
              <input type="email" placeholder="coach@example.com" autocomplete="email" />
            </span>
          </label>
          <label>
            密码
            <span class="auth-input-wrap auth-input-password">
              <input type="password" placeholder="输入密码" autocomplete="current-password" />
              <span class="auth-eye" aria-hidden="true">◎</span>
            </span>
          </label>
          <div class="password-help-row">
            <a class="forgot-password-link" href="../index.html">忘记密码？</a>
          </div>
          <div class="auth-form-row">
            <label class="checkbox-row">
              <input type="checkbox" />
              记住我
            </label>
          </div>
          <a class="primary-button auth-button" href="../index.html">登录</a>
          <div class="auth-divider"><span>或</span></div>
          <a class="ghost-button auth-button" href="../index.html">申请教练账号</a>
        </form>
      </section>
    </main>
  </body>
</html>
