<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>教练登录 · Ice Skating Coach Booking</title>
    <link rel="stylesheet" href="../../css/base.css?v=warm-ui-1" />
    <link rel="stylesheet" href="../../css/coach-profile.css?v=warm-ui-1" />
    <link rel="stylesheet" href="../../css/responsive.css?v=warm-ui-1" />
    <link rel="stylesheet" href="../../css/design-system.css?v=warm-ui-11" />
    <link rel="stylesheet" href="../../css/service-auth.css" />
  </head>
  <body class="landing-body service-auth-page">
    <main class="student-auth-shell coach-auth-shell" aria-labelledby="authHeading">
      <header class="student-auth-header">
        <div class="student-auth-brand">
          <div class="student-auth-logo" aria-hidden="true">
          </div>
          <div>
            <strong>冰场预约</strong>
            <span>专业滑冰教学预约平台</span>
          </div>
        </div>
        <a class="auth-back-link student-page-back" href="../../index.html">⌂ 返回首页</a>
      </header>

      <section class="student-auth-hero">
        <div class="student-auth-copy">
          <h1 id="authHeading">管理<span>教练</span>后台</h1>
          <p>设置每周开放时间，维护资料和价格，并查看实际预约课表。</p>
        </div>

        <a data-demo-only hidden class="primary-button public-preview-button" href="../index.html">先进入 demo 后台</a>

        <div class="access-summary-list">
          <div class="access-summary-item">
            <span class="access-icon public-access-icon" aria-hidden="true">□</span>
            <div>
              <strong>未审核</strong>
              <p>可以提交教练资料，等待冰场或管理员确认。</p>
            </div>
          </div>
          <div class="access-summary-item">
            <span class="access-icon full-access-icon" aria-hidden="true">✓</span>
            <div>
              <strong>已登录</strong>
              <p>管理开放时间、学生预约、课程价格和授课场馆。</p>
            </div>
          </div>
        </div>

        <div class="student-auth-benefits">
          <div>
            <span>◇</span>
            <strong>资料管理</strong>
            <small>头像、价格、场馆</small>
          </div>
          <div>
            <span>○</span>
            <strong>开放时间</strong>
            <small>每周重复设置</small>
          </div>
          <div>
            <span>☆</span>
            <strong>预约课表</strong>
            <small>查看学生安排</small>
          </div>
        </div>
      </section>

      <section class="auth-panel student-login-panel">
        <div class="auth-copy">
          <div class="student-login-mark" aria-hidden="true">
          </div>
          <h2>教练登录</h2>
          <p>登录后管理资料、开放时间和预约课表。</p>
        </div>

        <form id="coachLoginForm" class="auth-form" data-auth-form method="post" action="/api/auth/login">
          <label hidden>姓名<span class="auth-input-wrap"><input name="name" type="text" autocomplete="name" maxlength="100" /></span></label>
          <label>邮箱<span class="auth-input-wrap auth-input-email"><input name="email" type="email" placeholder="coach@example.com" autocomplete="email" required /></span></label>
          <label>密码<span class="auth-input-wrap auth-input-password">
            <input name="password" maxlength="128" type="password" placeholder="输入密码" autocomplete="current-password" required />
            <button type="button" class="auth-eye" data-auth-visibility aria-label="显示密码" aria-pressed="false">◎</button>
          </span></label>
          <div class="password-help-row"><button type="button" class="forgot-password-link" data-auth-recovery>忘记密码？</button></div>
          <div class="auth-form-row"><label class="checkbox-row"><input name="remember" type="checkbox" />记住我</label></div>
          <p data-auth-message role="status" aria-live="polite"></p>
          <button type="button" class="ghost-button" data-auth-retry hidden>重新连接</button>
          <button type="submit" class="primary-button auth-button" data-auth-submit disabled>登录</button>
          <div class="auth-divider"><span>或</span></div>
          <button type="button" class="ghost-button auth-button" data-auth-register aria-pressed="false">申请教练账号</button>
          <button type="button" class="ghost-button" data-auth-continue hidden>继续使用当前账号</button>
          <button type="button" class="ghost-button" data-auth-logout hidden>退出登录</button>
          <a class="ghost-button" data-demo-only hidden href="../index.html">本地 demo：预览后台</a>
        </form>
      </section>
    </main>
    <script type="module" src="../../js/coach-login-entry.js"></script>
  </body>
</html>
