<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>预约另约场地卡片真实场景预览</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/calendar.css" />
    <link rel="stylesheet" href="../css/design-system.css" />
    <style>
      body { min-width: 1120px; margin: 0; padding: 32px; background: #f3eee4; }
      .preview-shell { width: 1056px; margin: 0 auto; padding: 22px; border: 1px solid #ded5c8; border-radius: 22px; background: #fbf7ef; box-shadow: 0 12px 30px rgba(58, 52, 43, .08); }
      .preview-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
      .preview-heading h1 { margin: 0; color: #292d24; font-size: 20px; font-weight: 650; }
      .preview-heading p { margin: 5px 0 0; color: #777168; font-size: 13px; }
      .preview-key { color: #777168; font-size: 12px; text-align: right; }
      .preview-calendar { max-height: none; }
      .preview-calendar .calendar-cell.has-slot,
      .preview-calendar .calendar-cell.has-booking { background: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,.5)), var(--rink-color); }
      .preview-calendar .calendar-location-watermark { z-index: 1; }
      .preview-calendar .calendar-location-watermark-text { font-size: 15px; }
      .preview-calendar .coach-calendar-booking.preview-booking { grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); align-content: stretch; gap: 0; margin-inline: 1px; padding: 2px; border-left-width: 2px; }
      .preview-calendar .preview-booking .booking-primary,
      .preview-calendar .preview-booking .booking-secondary { width: 100%; min-width: 0; }
      .preview-calendar .preview-booking .booking-primary { display: flex; align-items: center; gap: 3px; }
      .preview-calendar .preview-booking strong { flex: 1 1 auto; min-width: 0; overflow: hidden; font-size: 11.5px; line-height: 1; text-overflow: ellipsis; white-space: nowrap; }
      .preview-calendar .preview-booking .location-change-badge { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; height: 15px; padding: 0 2px; border: 1px solid rgba(104,76,37,.3); border-radius: 999px; background: #fff8e8; color: #705021; font-size: 10px; font-weight: 650; line-height: 1; }
      .preview-calendar .preview-booking .booking-secondary { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px; color: #4f584b; font-size: 10.25px; font-weight: 500; line-height: 1; }
      .preview-calendar .preview-booking .booking-time { white-space: nowrap; }
      .preview-calendar .preview-booking .booking-rink { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .preview-calendar .scenario-day::after { display: block; margin-top: 1px; color: #777168; font-size: 9px; font-weight: 500; }
      .preview-calendar .scenario-normal::after { content: "正常地点"; }
      .preview-calendar .scenario-changed::after { content: "另约场地"; }
      .preview-calendar .scenario-long::after { content: "长姓名＋另约"; }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <div class="preview-heading">
        <div><h1>预约日历 · 30 分钟真实场景</h1><p>正式网格、列宽、字体、场馆底色与水印；行高保持 1.2px／分钟</p></div>
        <span class="preview-key">绿色卡片＝实际授课地点 Polar Ice Rink</span>
      </div>
      <section class="drag-calendar coach-week-calendar preview-calendar" aria-label="预约另约场地卡片真实场景预览">
        <div class="calendar-corner" style="grid-column:1;grid-row:1"></div>
        <div class="calendar-day scenario-day scenario-normal" style="grid-column:2;grid-row:1"><strong>周一</strong><span>11/16</span></div>
        <div class="calendar-day is-today scenario-day scenario-changed" style="grid-column:3;grid-row:1"><strong>周二</strong><span>11/17 · 今天</span></div>
        <div class="calendar-day scenario-day scenario-long" style="grid-column:4;grid-row:1"><strong>周三</strong><span>11/18</span></div>
        <div class="calendar-day" style="grid-column:5;grid-row:1"><strong>周四</strong><span>11/19</span></div>
        <div class="calendar-day" style="grid-column:6;grid-row:1"><strong>周五</strong><span>11/20</span></div>
        <div class="calendar-day" style="grid-column:7;grid-row:1"><strong>周六</strong><span>11/21</span></div>
        <div class="calendar-day" style="grid-column:8;grid-row:1"><strong>周日</strong><span>11/22</span></div>

        <div class="calendar-time" style="grid-column:1;grid-row:2 / span 30">06:30</div>
        <div class="calendar-time" style="grid-column:1;grid-row:32 / span 30">07:00</div>
        <div class="calendar-time" style="grid-column:1;grid-row:62 / span 30">07:30</div>

        <button class="calendar-cell has-slot" style="grid-column:2;grid-row:2 / span 30;--rink-color:#bbf7d0" type="button" aria-label="06:30–07:00 Polar Ice Rink 可预约"></button>
        <button class="calendar-cell has-slot" style="grid-column:3;grid-row:2 / span 30;--rink-color:#bfdbfe" type="button" aria-label="06:30–07:00 Arcadia Ice Arena 可预约"></button>
        <button class="calendar-cell has-slot" style="grid-column:4;grid-row:2 / span 30;--rink-color:#bfdbfe" type="button" aria-label="06:30–07:00 Arcadia Ice Arena 可预约"></button>
        <button class="calendar-cell" style="grid-column:5;grid-row:2 / span 30" type="button"></button>
        <button class="calendar-cell" style="grid-column:6;grid-row:2 / span 30" type="button"></button>
        <button class="calendar-cell" style="grid-column:7;grid-row:2 / span 30" type="button"></button>
        <button class="calendar-cell" style="grid-column:8;grid-row:2 / span 30" type="button"></button>

        <button class="calendar-cell has-slot has-booking" style="grid-column:2;grid-row:32 / span 30;--rink-color:#bbf7d0" type="button" aria-label="07:00–07:30 Polar Ice Rink 已预约"></button>
        <button class="calendar-cell has-slot has-booking" style="grid-column:3;grid-row:32 / span 30;--rink-color:#bfdbfe" type="button" aria-label="07:00–07:30 该时段开放冰场 Arcadia Ice Arena"></button>
        <button class="calendar-cell has-slot has-booking" style="grid-column:4;grid-row:32 / span 30;--rink-color:#bfdbfe" type="button" aria-label="07:00–07:30 该时段开放冰场 Arcadia Ice Arena"></button>
        <button class="calendar-cell" style="grid-column:5;grid-row:32 / span 30" type="button"></button>
        <button class="calendar-cell" style="grid-column:6;grid-row:32 / span 30" type="button"></button>
        <button class="calendar-cell" style="grid-column:7;grid-row:32 / span 30" type="button"></button>
        <button class="calendar-cell" style="grid-column:8;grid-row:32 / span 30" type="button"></button>

        <button class="calendar-cell has-slot" style="grid-column:2;grid-row:62 / span 30;--rink-color:#bbf7d0" type="button" aria-label="07:30–08:00 Polar Ice Rink 可预约"></button>
        <button class="calendar-cell has-slot" style="grid-column:3;grid-row:62 / span 30;--rink-color:#bfdbfe" type="button" aria-label="07:30–08:00 Arcadia Ice Arena 可预约"></button>
        <button class="calendar-cell has-slot" style="grid-column:4;grid-row:62 / span 30;--rink-color:#bfdbfe" type="button" aria-label="07:30–08:00 Arcadia Ice Arena 可预约"></button>
        <button class="calendar-cell" style="grid-column:5;grid-row:62 / span 30" type="button"></button>
        <button class="calendar-cell" style="grid-column:6;grid-row:62 / span 30" type="button"></button>
        <button class="calendar-cell" style="grid-column:7;grid-row:62 / span 30" type="button"></button>
        <button class="calendar-cell" style="grid-column:8;grid-row:62 / span 30" type="button"></button>

        <div class="calendar-location-watermark" style="grid-column:2;grid-row:2 / span 30" aria-hidden="true"><span class="calendar-location-watermark-text" style="--watermark-top:50%;--watermark-left:42%">POLAR</span></div>
        <div class="calendar-location-watermark" style="grid-column:2;grid-row:62 / span 30" aria-hidden="true"><span class="calendar-location-watermark-text" style="--watermark-top:50%;--watermark-left:62%">POLAR</span></div>
        <div class="calendar-location-watermark" style="grid-column:3;grid-row:2 / span 30" aria-hidden="true"><span class="calendar-location-watermark-text" style="--watermark-top:50%;--watermark-left:62%">ARCADIA</span></div>
        <div class="calendar-location-watermark" style="grid-column:3;grid-row:62 / span 30" aria-hidden="true"><span class="calendar-location-watermark-text" style="--watermark-top:50%;--watermark-left:42%">ARCADIA</span></div>
        <div class="calendar-location-watermark" style="grid-column:4;grid-row:2 / span 30" aria-hidden="true"><span class="calendar-location-watermark-text" style="--watermark-top:50%;--watermark-left:42%">ARCADIA</span></div>
        <div class="calendar-location-watermark" style="grid-column:4;grid-row:62 / span 30" aria-hidden="true"><span class="calendar-location-watermark-text" style="--watermark-top:50%;--watermark-left:62%">ARCADIA</span></div>

        <button class="coach-calendar-booking is-compact preview-booking" style="grid-column:2;grid-row:32 / span 30;--booking-accent:#4f8b68" type="button" title="Emily Zhang，07:00–07:30，Polar Ice Rink">
          <span class="booking-primary"><strong>Emily Zhang</strong></span>
          <span class="booking-secondary"><span class="booking-time">07:00–07:30</span><span class="booking-rink">Polar Ice</span></span>
        </button>
        <button class="coach-calendar-booking is-compact preview-booking is-location-changed" style="grid-column:3;grid-row:32 / span 30;--booking-accent:#4f8b68" type="button" title="Emily Zhang，07:00–07:30，该时段开放冰场：Arcadia Ice Arena，实际授课地点：Polar Ice Rink">
          <span class="booking-primary"><strong>Emily Zhang</strong><span class="location-change-badge">另约场地</span></span>
          <span class="booking-secondary"><span class="booking-time">07:00–07:30</span><span class="booking-rink">Polar Ice</span></span>
        </button>
        <button class="coach-calendar-booking is-compact preview-booking is-location-changed" style="grid-column:4;grid-row:32 / span 30;--booking-accent:#4f8b68" type="button" title="Alexandria Catherine Montgomery，07:00–07:30，该时段开放冰场：Arcadia Ice Arena，实际授课地点：Polar Ice Rink" aria-label="Alexandria Catherine Montgomery，另约场地，07:00–07:30，该时段开放冰场：Arcadia Ice Arena，实际授课地点：Polar Ice Rink">
          <span class="booking-primary"><strong title="Alexandria Catherine Montgomery">Alexandria Catherine Montgomery</strong><span class="location-change-badge">另约场地</span></span>
          <span class="booking-secondary"><span class="booking-time">07:00–07:30</span><span class="booking-rink">Polar Ice</span></span>
        </button>
      </section>
    </main>
  </body>
</html>
