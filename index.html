<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ice Skating Coach Booking</title>
    <link rel="stylesheet" href="css/base.css?v=warm-ui-1" />
    <link rel="stylesheet" href="css/coach-profile.css?v=warm-ui-1" />
    <link rel="stylesheet" href="css/design-system.css?v=warm-ui-11" />
  </head>
  <body class="landing-body">
    <main class="role-landing" aria-labelledby="landingHeading">
      <section class="landing-hero">
        <div class="landing-ice-scene" aria-hidden="true">
          <div class="skate-boot">
            <span class="boot-top"></span>
            <span class="boot-body"></span>
            <span class="boot-heel"></span>
            <span class="boot-blade"></span>
          </div>
          <div class="ice-ring ice-ring-one"></div>
          <div class="ice-ring ice-ring-two"></div>
        </div>
        <span class="snowflake snowflake-one" aria-hidden="true">✳</span>
        <span class="snowflake snowflake-two" aria-hidden="true">✳</span>
        <span class="snowflake snowflake-three" aria-hidden="true">✳</span>
        <div class="landing-copy">
          <div class="landing-brand-mark" aria-hidden="true">
          </div>
          <p class="eyebrow">冰场预约</p>
          <h1 id="landingHeading">滑冰私教课程预约</h1>
          <p class="landing-subtitle"><span></span>选择你的入口，开启专属冰上之旅<span></span></p>
          <div class="role-card-grid">
            <a class="role-card" href="student/login/index.html">
              <div class="role-card-icon calendar-icon" aria-hidden="true">
                <span></span>
              </div>
              <div>
                <span>学生入口</span>
                <strong>我要预约课程</strong>
                <small>登录后选择教练、场馆、时间和课程类型。</small>
              </div>
            </a>
            <a class="role-card" href="coach/login/index.html">
              <div class="role-card-icon check-icon" aria-hidden="true">
                <span></span>
              </div>
              <div>
                <span>教练入口</span>
                <strong>我要管理日程</strong>
                <small>登录后编辑资料、开放时间和实际课表。</small>
              </div>
            </a>
          </div>
          <p class="landing-tip">温馨提示：建议使用 Chrome、Safari 或 Edge 浏览器以获得最佳体验</p>
        </div>
      </section>
    </main>
  </body>
</html>
